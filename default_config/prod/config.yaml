# ─── Firebase iOS ────────────────────────────────────────────────────
# Pasos: Firebase Console → proyecto app-cursos-a5223 → Agregar app iOS
# Bundle ID: com.diegonicolas.openedx → Descargar GoogleService-Info.plist
# Los valores vienen de ese plist
FIREBASE:
  ENABLED: false
  CLOUD_MESSAGING_ENABLED: false
  PROJECT_ID: '${FIREBASE_PROJECT_ID}'
  GCM_SENDER_ID: '${FIREBASE_GCM_SENDER_ID}'
  API_KEY: '${FIREBASE_API_KEY}'
  CLIENT_ID: ''
  GOOGLE_APP_ID: '${FIREBASE_GOOGLE_APP_ID}'
  REVERSED_CLIENT_ID: ''

BRAZE:
  ENABLED: false
  PUSH_NOTIFICATIONS_ENABLED: false

GOOGLE:
  ENABLED: false
  CLIENT_ID: ''

MICROSOFT:
  ENABLED: false
  CLIENT_ID: ''

FACEBOOK:
  ENABLED: false
  FACEBOOK_APP_ID: ''
  CLIENT_TOKEN: ''

BRANCH:
  ENABLED: false
  KEY: ''
  URI_SCHEME: ''
  HOST: ''
  ALTERNATE_HOST: ''

WHATS_NEW_ENABLED: false
SOCIAL_AUTH_ENABLED: false
REGISTRATION_ENABLED: true
BROWSER_LOGIN: false
BROWSER_REGISTRATION: false
PRE_LOGIN_EXPERIENCE_ENABLED: true

EXPERIMENTAL_FEATURES:
