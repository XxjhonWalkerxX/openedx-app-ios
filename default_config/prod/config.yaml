  LOGIN_REGISTRATION_ENABLED: true
  SAML_SSO_LOGIN_ENABLED: false
  SAML_SSO_DEFAULT_LOGIN_BUTTON: false

LLAVEMX:
  ENABLED: true
  CLIENT_ID: "${LLAVEMX_CLIENT_ID}"
  AUTHORIZATION_ENDPOINT: "https://www.llave.gob.mx/oauth.xhtml"
  REDIRECT_URI: "mx.aprende.ios://oauth/callback"
